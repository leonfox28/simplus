        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        size: { type: integer, format: int64, minimum: 1, maximum: 134217728 }
        architecture: { type: string, enum: [amd64, arm64] }
    MihomoSubscription:
      type: object
      additionalProperties: false
      required: [id, displayName, url, urlHint, enabled, selected, artifactReady, lastRefreshAt, lastRefreshStatus, nodeCount, lastErrorCode]
      properties:
        id: { type: string, pattern: "^subscription_[A-Za-z0-9_-]{22}$" }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        url: { type: string, minLength: 1, maxLength: 4096 }
        urlHint: { type: string, minLength: 1, maxLength: 255 }
        enabled: { type: boolean }
        selected: { type: boolean, description: "Selected for the next start or restart; it may differ from the running process" }
        artifactReady: { type: boolean, description: "A generated artifact passed core validation even if the latest refresh failed" }
        lastRefreshAt: { type: string, maxLength: 64 }
        lastRefreshStatus: { type: string, enum: [never, success, failed] }
        nodeCount: { type: integer, minimum: 0, maximum: 10000 }
        lastErrorCode: { type: string, maxLength: 64 }
    MihomoSubscriptionMutation:
      type: object
      additionalProperties: false
      required: [displayName, url, enabled]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        url: { type: string, maxLength: 4096, description: Plaintext URL; required on create and empty on update preserves it }
        enabled: { type: boolean }
    MihomoSubscriptionCreateRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, minLength: 1, maxLength: 4096, description: Plaintext HTTPS URL; creation immediately downloads and validates the subscription }
    MihomoSubscriptionList:
      type: object
      additionalProperties: false
      required: [subscriptions]
      properties:
        subscriptions: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/MihomoSubscription" } }
    MihomoNode:
      type: object
      additionalProperties: false
      required: [id, displayName, kind, countryCode, countryName]
      properties:
        id: { type: string, pattern: "^node_[A-Za-z0-9_-]{22}$" }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        kind: { type: string, minLength: 1, maxLength: 32 }
        countryCode: { type: string, pattern: "^$|^[A-Z]{2}$" }
        countryName: { type: string, maxLength: 80 }
    MihomoNodeList:
      type: object
      additionalProperties: false
      required: [nodes]
      properties:
        nodes: { type: array, maxItems: 10000, items: { $ref: "#/components/schemas/MihomoNode" } }
    MihomoSubscriptionRefresh:
      type: object
      additionalProperties: false
      required: [subscription, nodes]
      properties:
        subscription: { $ref: "#/components/schemas/MihomoSubscription" }
        nodes: { type: array, maxItems: 10000, items: { $ref: "#/components/schemas/MihomoNode" } }
    LineEgressBinding:
      type: object
      additionalProperties: false
      required: [lineId, mode, countryCode, countryName, listenerPort, ready, readinessReason]
      properties:
        lineId: { type: string, pattern: "^line_[A-Za-z0-9_-]{22}$" }
        mode: { type: string, enum: [unconfigured, direct, mihomo-country] }
        countryCode: { type: string, pattern: "^$|^[A-Z]{2}$" }
        countryName: { type: string, maxLength: 80 }
        listenerPort: { type: integer, minimum: 0, maximum: 65535 }
        ready: { type: boolean }
        readinessReason: { type: string, enum: [READY, EGRESS_NOT_CONFIGURED, LINE_VOWIFI_UNSUPPORTED, SUBSCRIPTION_NOT_SELECTED, COUNTRY_NOT_FOUND, MIHOMO_NOT_RUNNING, MIHOMO_RESTART_REQUIRED] }
    LineEgressBindingMutation:
      type: object
      additionalProperties: false
      required: [mode, countryCode]
      properties:
        mode: { type: string, enum: [direct, mihomo-country] }
        countryCode: { type: string, pattern: "^$|^[A-Z]{2}$" }
    LineEgressBindingList:
      type: object
      additionalProperties: false
      required: [bindings]
      properties:
        bindings: { type: array, maxItems: 1024, items: { $ref: "#/components/schemas/LineEgressBinding" } }
    VoWiFiLineState:
      type: object
      additionalProperties: false
      required: [lineId, desiredActive, eligible, readinessCode, state, stage, online, egressMode, countryCode, countryName, registeredAt, nextRefreshAt, phoneNumber, attempt, lastErrorCode]
      properties:
        lineId: { type: string, pattern: "^line_[A-Za-z0-9_-]{22}$" }
        desiredActive: { type: boolean }
        eligible: { type: boolean }
        readinessCode: { type: string, enum: [READY, EGRESS_NOT_CONFIGURED, LINE_VOWIFI_UNSUPPORTED, LINE_HARDWARE_NOT_READY, SUBSCRIPTION_NOT_SELECTED, COUNTRY_NOT_FOUND, MIHOMO_NOT_RUNNING, MIHOMO_RESTART_REQUIRED] }
        state: { type: string, enum: [stopped, starting, connecting, registering, online, reconnecting, stopping, failed] }
        stage: { type: string, maxLength: 64 }
        online: { type: boolean }
        egressMode: { type: string, enum: [unconfigured, direct, mihomo-country] }
        countryCode: { type: string, pattern: "^$|^[A-Z]{2}$" }
        countryName: { type: string, maxLength: 80 }
        registeredAt: { type: string, maxLength: 64 }
        nextRefreshAt: { type: string, maxLength: 64 }
        phoneNumber: { type: string, pattern: "^$|^\\+[1-9][0-9]{2,14}$", maxLength: 16, description: E.164 phone number authorized by IMS registration; empty when unavailable }
        attempt: { type: integer, minimum: 0, maximum: 1000000 }
        lastErrorCode: { type: string, maxLength: 64 }
    VoWiFiLineStateList:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        lines: { type: array, maxItems: 1024, items: { $ref: "#/components/schemas/VoWiFiLineState" } }
    MihomoConfigStatus:
      type: object
      additionalProperties: false
      required: [published, launchable, sha256, generatedAt, errorCode, selectedSubscriptionId, runningSubscriptionId]
      properties:
        published: { type: boolean }
        launchable: { type: boolean, description: Active file passes the installed core validation; this does not mean a process is running }
        sha256: { type: string, pattern: "^$|^[0-9a-f]{64}$" }
        generatedAt: { type: string, maxLength: 64 }
        errorCode: { type: string, maxLength: 64 }
        selectedSubscriptionId: { type: string, maxLength: 64 }
        runningSubscriptionId: { type: string, maxLength: 64 }
    MihomoRuntimeStatus:
      type: object
      additionalProperties: false
      required: [state, pid, selectedSubscriptionId, runningSubscriptionId, pendingRestart, startedAt, lastErrorCode]
      properties:
        state: { type: string, enum: [stopped, running, fault] }
        pid: { type: integer, minimum: 0 }
        selectedSubscriptionId: { type: string, maxLength: 64 }
        runningSubscriptionId: { type: string, maxLength: 64 }
        pendingRestart: { type: boolean }
        startedAt: { type: string, maxLength: 64 }
        lastErrorCode: { type: string, maxLength: 64 }
    MihomoDashboardStatus:
      type: object
      additionalProperties: false
      required: [available, version, controllerAddress, url, secret]
      properties:
        available: { type: boolean }
        version: { type: string, pattern: "^v[0-9]+\\.[0-9]+\\.[0-9]+$" }
        controllerAddress: { type: string, maxLength: 64 }
        url: { type: string, maxLength: 256 }
        secret: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
    NotificationEventKind:
      type: string
      enum: [sms.received, sms.failed, call.incoming, call.missed, system.degraded]
    NotificationChannel:
      type: object
      additionalProperties: false
      required: [id, provider, displayName, webhookHint, signingSecretConfigured, enabled, eventKinds, lastDeliveryAt, lastDeliveryStatus, lastErrorCode]
      properties:
        id: { type: string, pattern: "^channel_[A-Za-z0-9_-]{22}$" }
        provider: { type: string, enum: [wecom, feishu] }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        webhookHint: { type: string, enum: [qyapi.weixin.qq.com, open.feishu.cn] }
        signingSecretConfigured: { type: boolean }
        enabled: { type: boolean }
        eventKinds: { type: array, minItems: 1, maxItems: 5, uniqueItems: true, items: { $ref: "#/components/schemas/NotificationEventKind" } }
        lastDeliveryAt: { type: string, maxLength: 64 }
        lastDeliveryStatus: { type: string, enum: [never, success, failed] }
        lastErrorCode: { type: string, maxLength: 64 }
    NotificationChannelMutation:
      type: object
      additionalProperties: false
      required: [provider, displayName, webhookUrl, signingSecret, enabled, eventKinds]
      properties:
        provider: { type: string, enum: [wecom, feishu] }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        webhookUrl: { type: string, maxLength: 4096, description: Required on create; empty on update preserves the credential }
        signingSecret: { type: string, maxLength: 512, description: Optional Feishu signature secret; empty preserves the existing secret }
        enabled: { type: boolean }
        eventKinds: { type: array, minItems: 1, maxItems: 5, uniqueItems: true, items: { $ref: "#/components/schemas/NotificationEventKind" } }
    NotificationChannelList:
      type: object
      additionalProperties: false
      required: [channels]
      properties:
        channels: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/NotificationChannel" } }
    AuthSessionResponse:
      type: object
      additionalProperties: false
      required: [username, locale, expiresAt]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        locale:
          type: string
          enum: [zh-CN, en-US]
        expiresAt:
          type: string
          format: date-time
    ApiError:
      type: object
      additionalProperties: false
      required: [code, retryable]
      properties:
        code:
          type: string
          pattern: "^[A-Z0-9_]+$"
        retryable:
          type: boolean
        reference:
          type: string
