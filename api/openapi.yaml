          description: Public root certificate and independently displayed fingerprint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupRootCertificateResponse"
        "400":
          description: The current setup mode has no local root certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No live setup session is present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "421":
          description: The HTTP authority is not a permitted loopback host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: The public root certificate could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The request exceeded the bounded control-plane deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/setup/inventory:
    get:
      operationId: getSetupInventory
      summary: Read the restricted HIL-0 inventory while the instance remains RF Off
      tags: [setup]
      responses:
        "200":
          description: Current read-only device and line snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryResponse"
        "401":
          description: No live setup session is present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: HTTPS setup is incomplete or setup is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "421":
          description: The HTTP authority is not a permitted loopback host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Inventory could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The request exceeded the bounded control-plane deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/setup/hardware/topology:
    get:
      operationId: getSetupHardwareTopology
      summary: Read the RF-Off normalized hardware topology during first-run setup
      tags: [setup, inventory]
      responses:
        "200":
          description: Current normalized RF-Off hardware topology
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HardwareTopologyResponse"
        "401":
          description: No live setup session is present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: HTTPS confirmation is incomplete or setup is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "421":
          description: The setup request authority is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: The hardware topology could not be produced or failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The request exceeded the bounded control-plane deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/setup/subscription-profiles/{profileId}/access-mode:
    put:
      operationId: putSetupSubscriptionProfileAccessMode
      summary: Persist a setup-time access mode without enabling RF
      tags: [setup]
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutAccessModeRequest"
      responses:
        "200":
          description: Updated setup inventory remains RF Off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryResponse"
        "400":
          description: Access mode is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No live setup session is present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Subscription profile was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: HTTPS setup is incomplete or setup is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "421":
          description: The HTTP authority is not a permitted loopback host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Access mode could not be persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The request exceeded the bounded control-plane deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/setup/hardware/confirm:
    post:
      operationId: confirmSetupHardware
      summary: Confirm the current RF-Off inventory and all per-profile access modes
      tags: [setup]
      responses:
        "200":
          description: Current hardware inventory digest was persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupSessionResponse"
        "400":
          description: A line lacks an access mode or is not RF Off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No live setup session is present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: HTTPS setup is incomplete or setup is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "421":
          description: The HTTP authority is not a permitted loopback host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Hardware review could not be persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The request exceeded the bounded control-plane deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/setup/complete:
    post:
      operationId: completeSetup
      summary: Revalidate every setup prerequisite and atomically enter ready
      tags: [setup]
      responses:
        "200":
          description: The instance is ready and requires normal administrator login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupCompletionResponse"
        "400":
          description: Current hardware no longer matches the reviewed RF-Off snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No live setup session is present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A prerequisite is incomplete or setup is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "421":
          description: The HTTP authority is not a permitted loopback host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Final storage, TLS, or atomic state transition failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The request exceeded the bounded control-plane deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/system/health:
    get:
      operationId: getSystemHealth
      summary: Read the local control-plane health snapshot
      tags: [system]
      responses:
        "200":
          description: Current health snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "421":
          description: The HTTP authority is not a permitted loopback host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: A durable subsystem could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The request exceeded the bounded control-plane deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    SetupCompletionResponse:
      type: object
      additionalProperties: false
      required: [installationState, managementUrl, loginRequired]
      properties:
        installationState:
          type: string
          enum: [ready]
        managementUrl:
          type: string
          minLength: 1
          maxLength: 2048
        loginRequired:
          type: boolean
          enum: [true]
    HealthStatus:
      type: string
      enum: [ok, degraded]
    InstallationState:
      type: string
      enum: [uninitialized, ready, maintenance]
    SetupPhase:
      type: string
      enum: [bootstrap-required, complete, maintenance]
    SetupFlow:
      type: string
      enum: [create-new]
    ConsumeBootstrapRequest:
      type: object
      additionalProperties: false
      required: [bootstrapCode]
      properties:
        bootstrapCode:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
    ConfigureSetupAdministratorRequest:
      type: object
      additionalProperties: false
      required: [username, password, passwordConfirmation, instanceDefaultLocale]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{2,31}$"
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
        passwordConfirmation:
          type: string
          format: password
          minLength: 12
          maxLength: 128
        instanceDefaultLocale:
          type: string
          enum: [zh-CN, en-US]
    ConfigureSetupStorageRequest:
      type: object
      additionalProperties: false
      required: [recordingsRoot]
      properties:
        recordingsRoot:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: "^/"
    SetupHTTPSMode:
      type: string
      enum: [loopback-only, local-ca]
    ConfigureSetupHTTPSRequest:
      type: object
      additionalProperties: false
      required: [mode, listenHost, listenPort, subjectAlternativeNames]
      properties:
        mode:
          $ref: "#/components/schemas/SetupHTTPSMode"
        listenHost:
          type: string
          minLength: 1
          maxLength: 255
        listenPort:
          type: integer
          minimum: 1
          maximum: 65535
        subjectAlternativeNames:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 253
    ConfirmSetupHTTPSRequest:
      type: object
      additionalProperties: false
      required: [rootFingerprintSha256]
      properties:
        rootFingerprintSha256:
          type: string
          pattern: "^[0-9A-F]{2}(:[0-9A-F]{2}){31}$"
    SetupRootCertificateResponse:
      type: object
      additionalProperties: false
      required: [pem, rootFingerprintSha256]
      properties:
        pem:
          type: string
          minLength: 1
        rootFingerprintSha256:
          type: string
          pattern: "^[0-9A-F]{2}(:[0-9A-F]{2}){31}$"
    SetupSessionResponse:
      type: object
      additionalProperties: false
      required:
        - authorized
        - expiresAt
        - selectedFlow
        - supportedFlows
        - administratorConfigured
        - administratorUsername
        - instanceDefaultLocale
        - storageConfigured
        - dataRoot
        - recordingsRoot
        - httpsConfigured
        - httpsConfirmed
        - httpsMode
        - httpsListenUrl
        - httpsRootFingerprint
        - httpsLeafNotAfter
        - hardwareReviewed
        - hardwareDeviceCount
        - hardwareLineCount
        - hardwareInventoryDigest
      properties:
        authorized:
          type: boolean
          enum: [true]
        expiresAt:
          type: string
          format: date-time
        selectedFlow:
          $ref: "#/components/schemas/SetupFlow"
        supportedFlows:
          type: array
          minItems: 1
          maxItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/SetupFlow"
        administratorConfigured:
          type: boolean
        administratorUsername:
          type: string
          maxLength: 32
        instanceDefaultLocale:
          type: string
          enum: [zh-CN, en-US]
        storageConfigured:
          type: boolean
        dataRoot:
          type: string
          maxLength: 4096
        recordingsRoot:
          type: string
          maxLength: 4096
        httpsConfigured:
          type: boolean
        httpsConfirmed:
          type: boolean
        httpsMode:
          type: string
          enum: ['', loopback-only, local-ca, imported]
        httpsListenUrl:
          type: string
          maxLength: 2048
        httpsRootFingerprint:
          type: string
          maxLength: 95
        httpsLeafNotAfter:
          type: string
          maxLength: 64
        hardwareReviewed:
          type: boolean
        hardwareDeviceCount:
          type: integer
          minimum: 0
        hardwareLineCount:
          type: integer
          minimum: 0
        hardwareInventoryDigest:
          type: string
          maxLength: 64
    RFSafetyState:
      type: string
      enum: [off, not-present, unknown]
    BackendKind:
      type: string
      enum: [simulator, hardware, replay]
    DeviceTransport:
      type: string
      enum: [simulated, usb, uart]
    PhysicalDeviceState:
      type: string
      enum: [available, unavailable]
    AccessMode:
      type: string
      enum: [cellular-native, host-vowifi-only, hold-rf-off]
    LineState:
      type: string
      enum: [awaiting-access-mode, ready, unavailable]
    PutAccessModeRequest:
      type: object
      additionalProperties: false
      required: [accessMode]
      properties:
        accessMode:
          $ref: "#/components/schemas/AccessMode"
    PhysicalDeviceSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - transport
        - state
        - modemFunctionCount
        - simSlotCount
        - resourceGroupCount
        - generation
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        transport:
          $ref: "#/components/schemas/DeviceTransport"
        state:
          $ref: "#/components/schemas/PhysicalDeviceState"
        modemFunctionCount:
          type: integer
          minimum: 0
        simSlotCount:
          type: integer
          minimum: 0
        resourceGroupCount:
          type: integer
          minimum: 0
        generation:
          type: integer
          format: int64
          minimum: 1
    LineSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - physicalDeviceId
        - subscriptionProfileId
        - displayName
        - accessMode
        - accessModeConfigured
        - state
        - rfSafety
        - generation
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
        physicalDeviceId:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
        subscriptionProfileId:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        accessMode:
          $ref: "#/components/schemas/AccessMode"
        accessModeConfigured:
          type: boolean
        state:
          $ref: "#/components/schemas/LineState"
        rfSafety:
          $ref: "#/components/schemas/RFSafetyState"
        generation:
          type: integer
          format: int64
          minimum: 1
    HardwareGeneration:
      type: integer
      format: int64
      minimum: 1
    TopologyRevision:
      type: string
      pattern: "^[0-9a-f]{64}$"
    HardwareBackend:
      type: string
      enum: [simulated, direct-at, direct-qmi, direct-mbim, modemmanager, pcsc]
    SIMSlotPresence:
      type: string
      enum: [present, absent, unknown]
    SIMMediaKind:
      type: string
      enum: [uicc, removable-euicc]
    SIMIdentityState:
      type: string
      enum: [known, unknown]
    SubscriptionProfileState:
      type: string
      enum: [active, inactive, locked]
    ResourceKind:
      type: string
      enum: [radio-control, sim-access, voice-media, sms-storage, sim-apdu, host-vowifi-auth, network-selection, sim-lock, euicc-profiles]
    HardwareCapabilities:
      type: object
      additionalProperties: false
      required:
        - simAccess
        - sms
        - cellularVoice
        - digitalVoiceMedia
        - usbUac
        - simApdu
        - hostVoWifiAuth
        - rfControl
        - networkScan
        - manualNetworkSelection
        - primarySimLockState
        - pin1Verify
        - puk1Unblock
        - euiccProfiles
      properties:
        simAccess: { type: boolean }
        sms: { type: boolean }
        cellularVoice: { type: boolean }
        digitalVoiceMedia: { type: boolean }
        usbUac: { type: boolean }
        simApdu: { type: boolean }
        hostVoWifiAuth: { type: boolean }
        rfControl: { type: boolean }
        networkScan: { type: boolean }
        manualNetworkSelection: { type: boolean }
        primarySimLockState: { type: boolean }
        pin1Verify: { type: boolean }
        puk1Unblock: { type: boolean }
        euiccProfiles: { type: boolean }
    PhysicalDeviceDetail:
      type: object
      additionalProperties: false
      required: [id, displayName, transport, state, generation]
      properties:
        id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
        displayName: { type: string, minLength: 1, maxLength: 256 }
        transport: { $ref: "#/components/schemas/DeviceTransport" }
        state: { $ref: "#/components/schemas/PhysicalDeviceState" }
        generation: { $ref: "#/components/schemas/HardwareGeneration" }
    ModemFunctionDetail:
      type: object
      additionalProperties: false
      required: [id, physicalDeviceId, displayName, backend, generation, capabilities]
      properties:
        id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
        physicalDeviceId: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
        displayName: { type: string, minLength: 1, maxLength: 256 }
        backend: { $ref: "#/components/schemas/HardwareBackend" }
        generation: { $ref: "#/components/schemas/HardwareGeneration" }
        capabilities: { $ref: "#/components/schemas/HardwareCapabilities" }
    SIMSlotDetail:
      type: object
      additionalProperties: false
      required: [id, physicalDeviceId, index, presence, activeMediaId, generation]
      properties:
        id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
        physicalDeviceId: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
        index: { type: integer, minimum: 0, maximum: 255 }
        presence: { $ref: "#/components/schemas/SIMSlotPresence" }
        activeMediaId: { type: string, maxLength: 64 }
        generation: { $ref: "#/components/schemas/HardwareGeneration" }
    SIMMediaDetail:
      type: object
      additionalProperties: false
      required: [id, simSlotId, kind, identityState, displayIdentityHint, generation]
      properties:
        id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
        simSlotId: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
        kind: { $ref: "#/components/schemas/SIMMediaKind" }
        identityState: { $ref: "#/components/schemas/SIMIdentityState" }
        displayIdentityHint: { type: string, minLength: 1, maxLength: 64 }
        generation: { $ref: "#/components/schemas/HardwareGeneration" }
    SubscriptionProfileDetail:
      type: object
      additionalProperties: false
      required: [id, simMediaId, displayName, state, displayIdentityHint, generation, accessMode, accessModeConfigured]
      properties:
        id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
        simMediaId: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
        displayName: { type: string, minLength: 1, maxLength: 256 }
        state: { $ref: "#/components/schemas/SubscriptionProfileState" }
        displayIdentityHint: { type: string, minLength: 1, maxLength: 64 }
        generation: { $ref: "#/components/schemas/HardwareGeneration" }
        accessMode: { $ref: "#/components/schemas/AccessMode" }
        accessModeConfigured: { type: boolean }
    ResourceGroupDetail:
      type: object
      additionalProperties: false
      required: [id, physicalDeviceId, displayName, resources, modemFunctionIds, simSlotIds, maxActiveCalls, maxConcurrentOps, generation]
      properties:
        id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
        physicalDeviceId: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
        displayName: { type: string, minLength: 1, maxLength: 256 }
        resources:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/ResourceKind" }
        modemFunctionIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
        simSlotIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
        maxActiveCalls: { type: integer, minimum: 0, maximum: 64 }
        maxConcurrentOps: { type: integer, minimum: 1, maximum: 64 }
        generation: { $ref: "#/components/schemas/HardwareGeneration" }
    HardwareLineDetail:
      type: object
      additionalProperties: false
      required: [id, physicalDeviceId, modemFunctionId, subscriptionProfileId, resourceGroupId, displayName, generation, capabilities, accessMode, accessModeConfigured, state, rfSafety]
      properties:
        id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
        physicalDeviceId: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
        modemFunctionId: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
        subscriptionProfileId: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
        resourceGroupId: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
        displayName: { type: string, minLength: 1, maxLength: 256 }
        generation: { $ref: "#/components/schemas/HardwareGeneration" }
        capabilities: { $ref: "#/components/schemas/HardwareCapabilities" }
        accessMode: { $ref: "#/components/schemas/AccessMode" }
        accessModeConfigured: { type: boolean }
        state: { $ref: "#/components/schemas/LineState" }
        rfSafety: { $ref: "#/components/schemas/RFSafetyState" }
    HardwareTopologyResponse:
      type: object
      additionalProperties: false
      required: [generation, revision, observedAt, devices, modemFunctions, simSlots, simMedia, subscriptionProfiles, resourceGroups, lines]
      properties:
        generation: { $ref: "#/components/schemas/HardwareGeneration" }
        revision: { $ref: "#/components/schemas/TopologyRevision" }
        observedAt: { type: string, format: date-time }
        devices:
          type: array
          items: { $ref: "#/components/schemas/PhysicalDeviceDetail" }
        modemFunctions:
          type: array
          items: { $ref: "#/components/schemas/ModemFunctionDetail" }
        simSlots:
          type: array
          items: { $ref: "#/components/schemas/SIMSlotDetail" }
        simMedia:
          type: array
          items: { $ref: "#/components/schemas/SIMMediaDetail" }
        subscriptionProfiles:
          type: array
          items: { $ref: "#/components/schemas/SubscriptionProfileDetail" }
        resourceGroups:
          type: array
          items: { $ref: "#/components/schemas/ResourceGroupDetail" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/HardwareLineDetail" }
    InventoryResponse:
      type: object
      additionalProperties: false
      required: [generation, revision, observedAt, devices, lines]
      properties:
        generation:
          $ref: "#/components/schemas/HardwareGeneration"
        revision:
          $ref: "#/components/schemas/TopologyRevision"
        observedAt:
          type: string
          format: date-time
        devices:
          type: array
          items:
            $ref: "#/components/schemas/PhysicalDeviceSummary"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/LineSummary"
    SMSDirection:
      type: string
      enum: [outbound, inbound]
    Contact:
      type: object
      additionalProperties: false
      required: [id, displayName, phoneNumber, createdAt, updatedAt]
      properties:
        id:
          type: string
          pattern: "^contact_[A-Za-z0-9_-]{16,120}$"
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        phoneNumber:
          type: string
          pattern: "^\\+?[0-9]{3,20}$"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Call:
      type: object
      additionalProperties: false
