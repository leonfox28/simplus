        "401":
          description: No live administrator session is present
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "404":
          description: Managed modem was not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "409":
          description: Modem is offline or its identity changed during the read
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "422":
          description: Equipment identity read is unsupported for this modem
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "503":
          description: Equipment identity is temporarily unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
  /api/v1/setup/status:
    get:
      operationId: getSetupStatus
      summary: Read the first-run boundary without opening normal business APIs
      tags: [setup]
      responses:
        "200":
          description: Current first-run boundary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatusResponse"
        "421":
          description: The HTTP authority is not a permitted loopback host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: The installation state could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The request exceeded the bounded control-plane deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/setup/bootstrap:
    post:
      operationId: consumeSetupBootstrap
      summary: Exchange a one-time root-generated bootstrap code for a restricted setup session
      tags: [setup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumeBootstrapRequest"
      responses:
        "200":
          description: Authorized setup session; the opaque session token is stored only in an HttpOnly cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupSessionResponse"
        "400":
          description: The request body is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: The bootstrap code is invalid, expired, or already consumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: First-run setup is not available in the current installation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "421":
          description: The HTTP authority is not a permitted loopback host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: The bootstrap exchange could not be completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The request exceeded the bounded control-plane deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/setup/session:
    get:
      operationId: getSetupSession
      summary: Resume the restricted first-run session from its HttpOnly cookie
      tags: [setup]
      responses:
        "200":
          description: Current restricted setup session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupSessionResponse"
        "401":
          description: No live setup session is present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: First-run setup is not available in the current installation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "421":
          description: The HTTP authority is not a permitted loopback host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: The setup session could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The request exceeded the bounded control-plane deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/setup/administrator:
    put:
      operationId: putSetupAdministrator
      summary: Create or replace the sole administrator while first-run setup remains uninitialized
      tags: [setup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigureSetupAdministratorRequest"
      responses:
        "200":
          description: Initial administrator configuration persisted; password material is never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupSessionResponse"
        "400":
          description: Username, password confirmation, password policy, locale, or body is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No live setup session is present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: First-run setup is not available in the current installation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "421":
          description: The HTTP authority is not a permitted loopback host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: The administrator configuration could not be persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The request exceeded the bounded control-plane deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/setup/storage:
    put:
      operationId: putSetupStorage
      summary: Validate and persist the data and recording roots for a new instance
      tags: [setup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigureSetupStorageRequest"
      responses:
        "200":
          description: Storage roots were identity-checked, write-tested, and persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupSessionResponse"
        "400":
          description: The recording root is invalid or conflicts with the live data root
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No live setup session is present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: An earlier setup prerequisite is incomplete or setup is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "421":
          description: The HTTP authority is not a permitted loopback host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: A storage root failed validation or persistence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The request exceeded the bounded control-plane deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/setup/https:
    put:
      operationId: putSetupHTTPS
      summary: Configure loopback management or generate a local-CA HTTPS candidate
      tags: [setup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigureSetupHTTPSRequest"
      responses:
        "200":
          description: Management endpoint configuration persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupSessionResponse"
        "400":
          description: Listener, mode, port, or SAN configuration is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No live setup session is present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Storage is incomplete or setup is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "421":
          description: The HTTP authority is not a permitted loopback host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Certificate generation, key protection, or persistence failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The request exceeded the bounded control-plane deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/setup/https/confirm:
    post:
      operationId: confirmSetupHTTPS
      summary: Confirm the displayed SHA-256 local root fingerprint
      tags: [setup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmSetupHTTPSRequest"
      responses:
        "200":
          description: The HTTPS candidate was confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupSessionResponse"
        "400":
          description: The fingerprint does not match the current candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No live setup session is present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Setup is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "421":
          description: The HTTP authority is not a permitted loopback host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Confirmation persistence failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The request exceeded the bounded control-plane deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/setup/https/root-certificate:
    get:
      operationId: getSetupHTTPSRootCertificate
      summary: Read the public local root certificate for explicit trust installation
      tags: [setup]
      responses:
        "200":
          description: Public root certificate and independently displayed fingerprint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupRootCertificateResponse"
        "400":
          description: The current setup mode has no local root certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No live setup session is present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "421":
          description: The HTTP authority is not a permitted loopback host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: The public root certificate could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The request exceeded the bounded control-plane deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/setup/inventory:
    get:
      operationId: getSetupInventory
      summary: Read the restricted HIL-0 inventory while the instance remains RF Off
      tags: [setup]
      responses:
        "200":
          description: Current read-only device and line snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryResponse"
        "401":
          description: No live setup session is present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: HTTPS setup is incomplete or setup is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "421":
          description: The HTTP authority is not a permitted loopback host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Inventory could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The request exceeded the bounded control-plane deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/setup/hardware/topology:
    get:
      operationId: getSetupHardwareTopology
      summary: Read the RF-Off normalized hardware topology during first-run setup
      tags: [setup, inventory]
      responses:
        "200":
          description: Current normalized RF-Off hardware topology
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HardwareTopologyResponse"
        "401":
          description: No live setup session is present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: HTTPS confirmation is incomplete or setup is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "421":
          description: The setup request authority is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: The hardware topology could not be produced or failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The request exceeded the bounded control-plane deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/setup/hardware/confirm:
    post:
      operationId: confirmSetupHardware
      summary: Confirm the current read-only hardware inventory
      tags: [setup]
      responses:
        "200":
          description: Current hardware inventory digest was persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupSessionResponse"
        "400":
          description: The current hardware topology is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No live setup session is present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: HTTPS setup is incomplete or setup is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "421":
          description: The HTTP authority is not a permitted loopback host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Hardware review could not be persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The request exceeded the bounded control-plane deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/setup/complete:
    post:
      operationId: completeSetup
      summary: Revalidate every setup prerequisite and atomically enter ready
      tags: [setup]
      responses:
        "200":
          description: The instance is ready and requires normal administrator login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupCompletionResponse"
        "400":
          description: Current hardware no longer matches the reviewed RF-Off snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No live setup session is present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A prerequisite is incomplete or setup is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "421":
          description: The HTTP authority is not a permitted loopback host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Final storage, TLS, or atomic state transition failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The request exceeded the bounded control-plane deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/system/health:
    get:
      operationId: getSystemHealth
      summary: Read the local control-plane health snapshot
      tags: [system]
      responses:
        "200":
          description: Current health snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "421":
          description: The HTTP authority is not a permitted loopback host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: A durable subsystem could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The request exceeded the bounded control-plane deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  parameters:
    PageLimit:
      name: limit
      in: query
      description: Maximum records returned; defaults to 20
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    PageCursor:
      name: cursor
      in: query
      description: Versioned opaque cursor from the previous page
      schema: { type: string, minLength: 1, maxLength: 256, pattern: "^[A-Za-z0-9_-]+$" }
  schemas:
    SetupCompletionResponse:
      type: object
      additionalProperties: false
      required: [installationState, managementUrl, loginRequired]
      properties:
        installationState:
          type: string
          enum: [ready]
        managementUrl:
          type: string
          minLength: 1
          maxLength: 2048
        loginRequired:
          type: boolean
          enum: [true]
    HealthStatus:
      type: string
      enum: [ok, degraded]
    InstallationState:
      type: string
      enum: [uninitialized, ready, maintenance]
    SetupPhase:
      type: string
      enum: [bootstrap-required, complete, maintenance]
    SetupFlow:
      type: string
      enum: [create-new]
    ConsumeBootstrapRequest:
      type: object
      additionalProperties: false
      required: [bootstrapCode]
      properties:
        bootstrapCode:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
    ConfigureSetupAdministratorRequest:
      type: object
      additionalProperties: false
      required: [username, password, passwordConfirmation, instanceDefaultLocale]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{2,31}$"
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
        passwordConfirmation:
          type: string
          format: password
          minLength: 12
          maxLength: 128
        instanceDefaultLocale:
          type: string
          enum: [zh-CN, en-US]
    ConfigureSetupStorageRequest:
      type: object
      additionalProperties: false
      required: [recordingsRoot]
      properties:
        recordingsRoot:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: "^/"
    SetupHTTPSMode:
      type: string
      enum: [loopback-only, local-ca]
    ConfigureSetupHTTPSRequest:
      type: object
      additionalProperties: false
      required: [mode, listenHost, listenPort, subjectAlternativeNames]
      properties:
        mode:
          $ref: "#/components/schemas/SetupHTTPSMode"
        listenHost:
          type: string
          minLength: 1
          maxLength: 255
        listenPort:
          type: integer
          minimum: 1
          maximum: 65535
        subjectAlternativeNames:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 253
    ConfirmSetupHTTPSRequest:
      type: object
      additionalProperties: false
      required: [rootFingerprintSha256]
      properties:
        rootFingerprintSha256:
          type: string
          pattern: "^[0-9A-F]{2}(:[0-9A-F]{2}){31}$"
    SetupRootCertificateResponse:
      type: object
      additionalProperties: false
      required: [pem, rootFingerprintSha256]
      properties:
        pem:
          type: string
          minLength: 1
        rootFingerprintSha256:
          type: string
          pattern: "^[0-9A-F]{2}(:[0-9A-F]{2}){31}$"
    SetupSessionResponse:
      type: object
      additionalProperties: false
      required:
        - authorized
        - expiresAt
        - selectedFlow
        - supportedFlows
        - administratorConfigured
        - administratorUsername
        - instanceDefaultLocale
        - storageConfigured
        - dataRoot
        - recordingsRoot
        - httpsConfigured
        - httpsConfirmed
        - httpsMode
        - httpsListenUrl
        - httpsRootFingerprint
        - httpsLeafNotAfter
        - hardwareReviewed
        - hardwareDeviceCount
        - hardwareLineCount
        - hardwareInventoryDigest
      properties:
        authorized:
          type: boolean
          enum: [true]
        expiresAt:
          type: string
          format: date-time
        selectedFlow:
          $ref: "#/components/schemas/SetupFlow"
        supportedFlows:
          type: array
          minItems: 1
          maxItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/SetupFlow"
        administratorConfigured:
          type: boolean
        administratorUsername:
          type: string
          maxLength: 32
        instanceDefaultLocale:
          type: string
          enum: [zh-CN, en-US]
        storageConfigured:
          type: boolean
        dataRoot:
          type: string
          maxLength: 4096
        recordingsRoot:
          type: string
          maxLength: 4096
        httpsConfigured:
          type: boolean
        httpsConfirmed:
          type: boolean
        httpsMode:
          type: string
          enum: ['', loopback-only, local-ca, imported]
        httpsListenUrl:
          type: string
          maxLength: 2048
        httpsRootFingerprint:
          type: string
          maxLength: 95
        httpsLeafNotAfter:
          type: string
          maxLength: 64
        hardwareReviewed:
          type: boolean
        hardwareDeviceCount:
          type: integer
          minimum: 0
        hardwareLineCount:
          type: integer
          minimum: 0
        hardwareInventoryDigest:
          type: string
          maxLength: 64
    BackendKind:
      type: string
      enum: [simulator, hardware, replay]
    DeviceTransport:
      type: string
      enum: [simulated, usb, uart]
    PhysicalDeviceState:
      type: string
      enum: [available, unavailable]
    LineState:
      type: string
      enum: [ready, unavailable]
    PhysicalDeviceSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - transport
        - state
        - modemFunctionCount
        - simSlotCount
        - resourceGroupCount
        - generation
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        transport:
          $ref: "#/components/schemas/DeviceTransport"
        state:
          $ref: "#/components/schemas/PhysicalDeviceState"
        modemFunctionCount:
          type: integer
          minimum: 0
        simSlotCount:
          type: integer
          minimum: 0
        resourceGroupCount:
          type: integer
          minimum: 0
        generation:
          type: integer
          format: int64
          minimum: 1
    LineSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - physicalDeviceId
        - subscriptionProfileId
        - displayName
        - state
        - generation
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
        physicalDeviceId:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
        subscriptionProfileId:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        state:
          $ref: "#/components/schemas/LineState"
        generation:
          type: integer
          format: int64
          minimum: 1
    HardwareGeneration:
      type: integer
      format: int64
      minimum: 1
    TopologyRevision:
      type: string
      pattern: "^[0-9a-f]{64}$"
    HardwareBackend:
      type: string
      enum: [simulated, direct-at, direct-qmi, direct-mbim, modemmanager, pcsc]
    SIMSlotPresence:
      type: string
      enum: [present, absent, unknown]
    SIMMediaKind:
      type: string
      enum: [uicc, removable-euicc]
    SIMIdentityState:
      type: string
      enum: [known, unknown]
    SubscriptionProfileState:
      type: string
      enum: [active, inactive, locked]
    ResourceKind:
      type: string
      enum: [radio-control, sim-access, voice-media, sms-storage, sim-apdu, host-vowifi-auth, network-selection, sim-lock, euicc-profiles]
    HardwareCapabilities:
      type: object
      additionalProperties: false
      required:
        - simAccess
        - sms
        - cellularVoice
        - digitalVoiceMedia
        - usbUac
        - simApdu
        - hostVoWifiAuth
        - rfControl
        - networkScan
        - manualNetworkSelection
        - primarySimLockState
        - pin1Verify
        - puk1Unblock
        - euiccProfiles
      properties:
        simAccess: { type: boolean }
        sms: { type: boolean }
        cellularVoice: { type: boolean }
        digitalVoiceMedia: { type: boolean }
        usbUac: { type: boolean }
        simApdu: { type: boolean }
