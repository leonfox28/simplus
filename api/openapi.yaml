openapi: 3.0.3
info:
  title: Simplus API
  version: 0.1.0
  description: Locale-neutral control-plane contract for Simplus.
servers:
  - url: /
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Create an administrator browser session
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated administrator session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          description: Invalid login request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Credentials are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The instance is not ready for login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many failed login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Login could not be completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/session:
    get:
      operationId: getAuthSession
      summary: Read the current administrator browser session
      tags: [auth]
      responses:
        "200":
          description: Current authenticated administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          description: No live administrator session is present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Session state could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current administrator browser session
      tags: [auth]
      responses:
        "204":
          description: Session revoked
        "401":
          description: No live administrator session is present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: CSRF validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Logout could not be completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/password:
    put:
      operationId: changeAdministratorPassword
      summary: Replace the sole administrator password and revoke all sessions
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeAdministratorPasswordRequest"
      responses:
        "204": { description: Password replaced; every administrator session was revoked }
        "400":
          description: Password request is invalid
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "401":
          description: Session or current password is invalid
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "403":
          description: CSRF validation failed
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "500":
          description: Password could not be replaced
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
  /api/v1/inventory:
    get:
      operationId: getInventory
      summary: Read the discovered device and active-line inventory
      tags: [inventory]
      responses:
        "200":
          description: Current inventory snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryResponse"
        "409":
          description: The instance has not completed setup or is not ready for business APIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "421":
          description: The HTTP authority is not a permitted loopback host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: The inventory snapshot could not be produced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/mihomo/core:
    get:
      operationId: getMihomoCoreStatus
      summary: Read the locally installed Mihomo core status
      tags: [mihomo]
      responses:
        "200": { description: Current core status, content: { application/json: { schema: { $ref: "#/components/schemas/MihomoCoreStatus" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "500": { description: Status unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/mihomo/dashboard:
    get:
      operationId: getMihomoDashboardStatus
      summary: Read the installed Zashboard entry point and Mihomo controller credentials
      tags: [mihomo]
      responses:
        "200": { description: Zashboard status, content: { application/json: { schema: { $ref: "#/components/schemas/MihomoDashboardStatus" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "500": { description: Dashboard status unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/mihomo/core/latest:
    get:
      operationId: getLatestMihomoCore
      summary: Check the official MetaCubeX stable release
      tags: [mihomo]
      responses:
        "200": { description: Supported official release candidate, content: { application/json: { schema: { $ref: "#/components/schemas/MihomoCoreCandidate" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "502": { description: Official release metadata unavailable or invalid, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/mihomo/core/install:
    post:
      operationId: installLatestMihomoCore
      summary: Download, verify, probe, and atomically install the latest official stable core
      tags: [mihomo]
      responses:
        "200": { description: Installed core status, content: { application/json: { schema: { $ref: "#/components/schemas/MihomoCoreStatus" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { description: CSRF validation failed, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: This version is already installed, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "502": { description: Download or verification failed, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/mihomo/config:
    get:
      operationId: getMihomoConfigStatus
      summary: Read generated configuration status without starting Mihomo
      tags: [mihomo]
      responses:
        "200": { description: Configuration status, content: { application/json: { schema: { $ref: "#/components/schemas/MihomoConfigStatus" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
    post:
      operationId: publishMihomoConfig
      summary: Generate, validate, and atomically publish configuration without starting Mihomo
      tags: [mihomo]
      responses:
        "200": { description: Validated configuration published, content: { application/json: { schema: { $ref: "#/components/schemas/MihomoConfigStatus" } } } }
        "400": { description: Profiles or selections are not ready, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: Candidate validation failed and was not published, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/mihomo/runtime:
    get:
      operationId: getMihomoRuntimeStatus
      summary: Read Mihomo process state and selected/running subscription distinction
      tags: [mihomo]
      responses:
        "200": { description: Runtime status, content: { application/json: { schema: { $ref: "#/components/schemas/MihomoRuntimeStatus" } } } }
  /api/v1/mihomo/runtime/start:
    post:
      operationId: startMihomo
      summary: Start Mihomo with the currently selected and revalidated subscription artifact
      tags: [mihomo]
      responses:
        "200": { description: Started, content: { application/json: { schema: { $ref: "#/components/schemas/MihomoRuntimeStatus" } } } }
        "409": { description: Not launchable or already running, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/mihomo/runtime/restart:
    post:
      operationId: restartMihomo
      summary: Revalidate selected artifact and restart Mihomo to apply it
      tags: [mihomo]
      responses:
        "200": { description: Restarted, content: { application/json: { schema: { $ref: "#/components/schemas/MihomoRuntimeStatus" } } } }
        "409": { description: Selected artifact is not launchable, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/mihomo/runtime/stop:
    post:
      operationId: stopMihomo
      summary: Stop the managed Mihomo process
      tags: [mihomo]
      responses:
        "200": { description: Stopped, content: { application/json: { schema: { $ref: "#/components/schemas/MihomoRuntimeStatus" } } } }
        "409": { description: Mihomo is not running, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/mihomo/subscriptions:
    get:
      operationId: listMihomoSubscriptions
      tags: [mihomo]
      summary: List subscriptions including their plaintext URLs
      responses:
        "200": { description: Subscriptions, content: { application/json: { schema: { $ref: "#/components/schemas/MihomoSubscriptionList" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
    post:
      operationId: createMihomoSubscription
      tags: [mihomo]
      summary: Store a plaintext HTTPS subscription URL in the private database
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MihomoSubscriptionCreateRequest" } } } }
      responses:
        "201": { description: Created subscription, content: { application/json: { schema: { $ref: "#/components/schemas/MihomoSubscription" } } } }
        "400": { description: Invalid subscription, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { description: CSRF validation failed, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/mihomo/subscriptions/{subscriptionId}:
    parameters:
      - { name: subscriptionId, in: path, required: true, schema: { type: string, pattern: "^subscription_[A-Za-z0-9_-]{22}$" } }
    put:
      operationId: updateMihomoSubscription
      tags: [mihomo]
      summary: Update subscription metadata and optionally replace its secret URL
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MihomoSubscriptionMutation" } } } }
      responses:
        "200": { description: Updated subscription, content: { application/json: { schema: { $ref: "#/components/schemas/MihomoSubscription" } } } }
        "400": { description: Invalid subscription, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: Subscription not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
    delete:
      operationId: deleteMihomoSubscription
      tags: [mihomo]
      summary: Delete a subscription not referenced by an egress profile
      responses:
        "204": { description: Deleted }
        "404": { description: Subscription not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/mihomo/subscriptions/{subscriptionId}/refresh:
    parameters:
      - { name: subscriptionId, in: path, required: true, schema: { type: string, pattern: "^subscription_[A-Za-z0-9_-]{22}$" } }
    post:
      operationId: refreshMihomoSubscription
      tags: [mihomo]
      summary: Fetch and summarize one encrypted subscription
      responses:
        "200": { description: Refreshed subscription and nodes, content: { application/json: { schema: { $ref: "#/components/schemas/MihomoSubscriptionRefresh" } } } }
        "404": { description: Subscription not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "502": { description: Fetch or parse failed, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/mihomo/subscriptions/{subscriptionId}/nodes:
    parameters:
      - { name: subscriptionId, in: path, required: true, schema: { type: string, pattern: "^subscription_[A-Za-z0-9_-]{22}$" } }
    get:
      operationId: listMihomoSubscriptionNodes
      tags: [mihomo]
      summary: List non-secret node summaries
      responses:
        "200": { description: Node summaries, content: { application/json: { schema: { $ref: "#/components/schemas/MihomoNodeList" } } } }
        "404": { description: Subscription not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/mihomo/subscriptions/{subscriptionId}/select:
    parameters:
      - { name: subscriptionId, in: path, required: true, schema: { type: string, pattern: "^subscription_[A-Za-z0-9_-]{22}$" } }
    post:
      operationId: selectMihomoSubscription
      tags: [mihomo]
      summary: Revalidate and select this artifact for the next start or restart without managing the process
      responses:
        "200": { description: Selected configuration status, content: { application/json: { schema: { $ref: "#/components/schemas/MihomoConfigStatus" } } } }
        "400": { description: Subscription artifact is not ready, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: Current core rejected the stored configuration, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/line-egress-bindings:
    get:
      operationId: listLineEgressBindings
      tags: [lines]
      summary: List explicit direct, Mihomo-country, or unconfigured egress state for current Lines
      responses:
        "200": { description: Line egress bindings, content: { application/json: { schema: { $ref: "#/components/schemas/LineEgressBindingList" } } } }
  /api/v1/lines/{lineId}/egress:
    parameters:
      - { name: lineId, in: path, required: true, schema: { type: string, pattern: "^line_[A-Za-z0-9_-]{22}$" } }
    put:
      operationId: putLineEgressBinding
      tags: [lines]
      summary: Persist an explicit direct or Mihomo-country Line egress choice without rewriting or restarting Mihomo
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LineEgressBindingMutation" } } } }
      responses:
        "200": { description: Updated Line egress binding, content: { application/json: { schema: { $ref: "#/components/schemas/LineEgressBinding" } } } }
        "400": { description: Invalid mode or unavailable country, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: Line not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: Line does not support Host VoWiFi, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/vowifi-lines:
    get:
      operationId: listVoWiFiLines
      tags: [lines]
      summary: List desired and observed Host VoWiFi state for current Lines
      responses:
        "200": { description: Host VoWiFi Line states, content: { application/json: { schema: { $ref: "#/components/schemas/VoWiFiLineStateList" } } } }
        "503": { description: Host VoWiFi runtime unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/vowifi-lines/{lineId}/activate:
    parameters:
      - { name: lineId, in: path, required: true, schema: { type: string, pattern: "^line_[A-Za-z0-9_-]{22}$" } }
    post:
      operationId: activateVoWiFiLine
      tags: [lines]
      summary: Persist activation intent and start the fixed Host VoWiFi runtime
      responses:
        "202": { description: Activation accepted, content: { application/json: { schema: { $ref: "#/components/schemas/VoWiFiLineState" } } } }
        "404": { description: Line not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: "Line, SIM/Profile capability, or explicit egress is not ready", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "503": { description: Host VoWiFi runtime unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/vowifi-lines/{lineId}/deactivate:
    parameters:
      - { name: lineId, in: path, required: true, schema: { type: string, pattern: "^line_[A-Za-z0-9_-]{22}$" } }
    post:
      operationId: deactivateVoWiFiLine
      tags: [lines]
      summary: Persist deactivation intent and remove the Line runtime
      responses:
        "200": { description: Line stopped, content: { application/json: { schema: { $ref: "#/components/schemas/VoWiFiLineState" } } } }
        "404": { description: Line not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "503": { description: Host VoWiFi runtime unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/notification-channels:
    get:
      operationId: listNotificationChannels
      tags: [notifications]
      summary: List outbound notification channels without credentials
      responses:
        "200": { description: Channels, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationChannelList" } } } }
    post:
      operationId: createNotificationChannel
      tags: [notifications]
      summary: Store an encrypted WeCom or Feishu webhook
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationChannelMutation" } } } }
      responses:
        "201": { description: Created channel, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationChannel" } } } }
        "400": { description: Invalid channel, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/notification-channels/{channelId}:
    parameters:
      - { name: channelId, in: path, required: true, schema: { type: string, pattern: "^channel_[A-Za-z0-9_-]{22}$" } }
    put:
      operationId: updateNotificationChannel
      tags: [notifications]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationChannelMutation" } } } }
      responses:
        "200": { description: Updated channel, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationChannel" } } } }
        "404": { description: Channel not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
    delete:
      operationId: deleteNotificationChannel
      tags: [notifications]
      responses:
        "204": { description: Deleted }
        "404": { description: Channel not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/notification-channels/{channelId}/test:
    parameters:
      - { name: channelId, in: path, required: true, schema: { type: string, pattern: "^channel_[A-Za-z0-9_-]{22}$" } }
    post:
      operationId: testNotificationChannel
      tags: [notifications]
      summary: Send one explicit test message
      responses:
        "200": { description: Updated delivery status, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationChannel" } } } }
        "404": { description: Channel not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "502": { description: Provider rejected or could not receive the test, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/messages:
    get:
      operationId: listMessages
      summary: List the most recent durable SMS records
      tags: [messages]
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
        - name: lineId
          in: query
          description: Optional stable Line identity; remoteAddress is required when lineId is present
          schema: { type: string, pattern: "^line_[A-Za-z0-9_-]{22}$" }
        - name: remoteAddress
          in: query
          description: Optional exact conversation peer; without lineId, returns the peer history across Lines
          schema: { type: string, pattern: "^(?:\\+?[0-9]{3,20}|[A-Za-z][A-Za-z0-9 ._-]{0,19})$" }
      responses:
        "200":
          description: Most recent SMS records, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SMSMessageListResponse"
        "401":
          description: No live administrator session is present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Pagination cursor, limit, or conversation filter is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The instance is not ready for business APIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "421":
          description: The HTTP authority is not a permitted loopback host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Message history could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Messaging is not configured for this runtime
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The request exceeded the bounded control-plane deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: sendMessage
      summary: Persist and send one SMS on a selected line
      tags: [messages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendSMSRequest"
      responses:
        "200":
          description: An idempotent replay of an existing operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SMSMessage"
        "201":
          description: The SMS operation was created and reached its current durable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SMSMessage"
        "400":
          description: The operation id, line, destination, or body is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No live administrator session is present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: CSRF validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The selected line is not present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The line is unavailable, the instance is not ready, or the operation id conflicts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "421":
          description: The HTTP authority is not a permitted loopback host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: The selected line does not support SMS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: The durable SMS state could not be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The SMS transport or inventory is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The request exceeded the bounded control-plane deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/message-conversations:
    get:
      operationId: listMessageConversations
      summary: List durable SMS conversations by exact remote address
      tags: [messages]
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: Most recent SMS conversations, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SMSConversationListResponse"
        "400":
          description: Pagination cursor or limit is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No live administrator session is present
          content:
            application/json:
              schema:
